        this.restCallback = null;
        this._init();
    }

    async _init() {
        this.breath.startSimulate();
        await this._renderMenu();
        this._setupGlobalKeys();
    }

    async _renderMenu() {
        this.currentView = 'menu';
        this.root.innerHTML = `
            <div class="max-w-6xl mx-auto">
                <div class="text-center mb-12">
                    <h1 class="text-4xl md:text-5xl font-bold bg-gradient-to-r from-rose-300 via-amber-200 to-sky-300 bg-clip-text text-transparent mb-3">
                        🌬️ 呼吸訓練 · 五款遊戲
                    </h1>
                    <p class="text-slate-400 text-sm md:text-base max-w-2xl mx-auto">
                        使用呼吸強度 (0–100) 控制遊戲 · 支援模擬 / 鍵盤 / 串列裝置
                    </p>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5 mb-8">
                    ${Object.entries(GAME_META).map(([id, meta]) => `
                        <div class="game-card" data-game="${id}">
                            <div class="icon">${meta.icon}</div>
                            <div class="title">${meta.label}</div>
                            <div class="desc">${meta.desc}</div>
                            <div class="mt-3 text-xs text-slate-500">關卡 1–5 · 呼吸控制</div>
                        </div>
                    `).join('')}
                </div>
                <div class="flex flex-wrap items-center justify-center gap-4 bg-white/5 backdrop-blur rounded-2xl p-5 border border-white/5">
                    <div class="flex items-center gap-3">
                        <span class="text-slate-400 text-sm">輸入模式</span>
                        <button class="btn-game primary mode-btn" data-mode="simulate">🌊 模擬</button>
                        <button class="btn-game mode-btn" data-mode="keyboard">⌨️ 鍵盤</button>
                        <button class="btn-game mode-btn" data-mode="serial">🔌 串列</button>
                    </div>
                    <div class="w-px h-8 bg-white/10"></div>
                    <button class="btn-game success calibrate-btn">🎯 校正 (2s)</button>
                    <div class="w-px h-8 bg-white/10"></div>
                    <div class="flex items-center gap-3 text-sm text-slate-400">
                        <span>呼吸值</span>
                        <span class="text-white font-mono text-lg breath-display">50</span>
                        <div class="breath-bar-track w-32">
                            <div class="breath-bar-fill" style="width:50%"></div>
                        </div>
                    </div>
                </div>
                <div class="mt-6 text-center text-xs text-slate-500/60">
                    💡 鍵盤操作: ↑/W 吸氣 · ↓/S 吐氣 · 空白鍵 重置50
                </div>
            </div>
        `;
        $$('.game-card').forEach(el => {
            el.addEventListener('click', () => {
                const id = el.dataset.game;
                this._startGame(id);
            });
        });
        $$('.mode-btn').forEach(el => {
            el.addEventListener('click', () => {
                const mode = el.dataset.mode;
                this._setInputMode(mode);
                $$('.mode-btn').forEach(b => b.classList.remove('primary'));
                el.classList.add('primary');
            });
        });
        $('.calibrate-btn')?.addEventListener('click', async () => {
            const btn = $('.calibrate-btn');
            btn.textContent = '🔄 校正中...';
            btn.disabled = true;
            const base = await this.breath.calibrate(2000);
            btn.textContent = `✅ 基線 ${base}`;
            setTimeout(() => {
                btn.textContent = '🎯 校正 (2s)';
                btn.disabled = false;
            }, 1500);
        });
        this._breathDisplayInterval = setInterval(() => {
            const v = this.breath.getValue();
            const display = $('.breath-display');
            const bar = $('.breath-bar-fill');
            if (display) display.textContent = v;
            if (bar) bar.style.width = v + '%';
        }, 80);
        const activeMode = this.breath.mode || 'simulate';
        const btn = $(`.mode-btn[data-mode="${activeMode}"]`);
        if (btn) btn.classList.add('primary');
        $('[data-mode="serial"]')?.addEventListener('click', async () => {
            const ok = await this.breath.connectSerial();
            if (!ok) alert('無法連線串列裝置，請確認裝置已連接並授權。');
        });
    }

    _startGame(gameId) {
        if (this.gameInstance) { this.gameInstance.destroy(); this.gameInstance = null; }
        this.currentView = 'game';
        const container = document.createElement('div');
        container.className = 'game-canvas-wrap w-full max-w-4xl mx-auto relative fade-enter';
        container.style.aspectRatio = '16/9';
        container.style.minHeight = '400px';
        this.root.innerHTML = '';
        this.root.appendChild(container);
        this.container = container;
        let GameClass;
        switch (gameId) {
            case GAMES.WIND_PAINTER: GameClass = WindPainterGame; break;
            case GAMES.CANDLE_EXPEDITION: GameClass = CandleExpeditionGame; break;
            case GAMES.MAGE_BREAKER: GameClass = MageBreakerGame; break;
            case GAMES.DANDELION_EXPRESS: GameClass = DandelionExpressGame; break;
            case GAMES.GLASS_HEART: GameClass = GlassHeartGame; break;
            default: return;
        }
        const game = new GameClass(container, this.breath);
        this.gameInstance = game;
        const rect = container.getBoundingClientRect();
        const w = rect.width || 800;
        const h = rect.height || 450;
        game.init(w, h);
        game.setRestCallback((active) => { this._updateRestUI(active); });
        game.onGameOver = () => {
            this._showOverlay('💔 失敗', '再試一次', () => { this._startGame(gameId); });
            Logger.gameEvent(gameId, 'game_over', { score: game.score, lives: game.lives });
        };
        game.onAllComplete = () => {
            this._showOverlay('🏆 全部通關！', '回到選單', () => { this._renderMenu(); });
            Logger.gameEvent(gameId, 'all_complete', { score: game.score });
        };
        game.onLevelUp = () => { this._showLevelUp(game.level); };
        this._renderHUD(game);
        this._renderBreathBar();
        this._renderGameControls(game);
        game.start();
        const backBtn = document.createElement('button');
        backBtn.className = 'btn-game absolute top-4 left-4 z-20 bg-black/40 hover:bg-black/60';
        backBtn.innerHTML = '<i class="fas fa-arrow-left"></i> 返回';
        backBtn.style.pointerEvents = 'auto';
        backBtn.addEventListener('click', () => {
            game.stop();
            this._renderMenu();
        });
        container.appendChild(backBtn);
        this._resizeObserver = new ResizeObserver(() => {
            if (game && game.canvas) {
                const r = container.getBoundingClientRect();
                game.canvas.width = r.width || 800;
                game.canvas.height = r.height || 450;
                game.width = game.canvas.width;
                game.height = game.canvas.height;
            }
        });
        this._resizeObserver.observe(container);
    }

    _renderHUD(game) {
        const container = this.container;
        if (!container) return;
        const hud = document.createElement('div');
        hud.className = 'hud-overlay';
        hud.id = 'game-hud';
        hud.innerHTML = `
            <div class="hud-left">
                <div class="font-semibold text-sm">${game.gameTitle}</div>
                <div class="flex gap-4 text-xs text-slate-300">
                    <span>🏰 Lv.${game.level}/${game.maxLevel}</span>
                    <span>⭐ ${game.score}</span>
                    <span>🔥 x${game.combo}</span>
                </div>
                <div class="flex gap-1 mt-1">
                    ${Array.from({ length: game.maxLives }, (_, i) =>
                        `<span class="text-${i < game.lives ? 'rose-400' : 'slate-600'}">❤️</span>`
                    ).join('')}
                </div>
            </div>
            <div class="hud-right" id="hud-right">
                <div class="stat"><i class="fas fa-wind"></i> <span id="hud-breath">50</span></div>
                <div class="stat"><i class="fas fa-clock"></i> <span id="hud-rest">--</span></div>
            </div>
        `;
        container.appendChild(hud);
        this._hudInterval = setInterval(() => {
            const data = game.getHUDData();
            const breathEl = document.getElementById('hud-breath');
            if (breathEl) breathEl.textContent = data.breath;
            const restEl = document.getElementById('hud-rest');
            if (restEl) {
                restEl.textContent = data.isResting ? `🧘 ${Math.ceil(data.restDuration - data.restTotal)}s` : '--';
            }
            const livesContainer = hud.querySelector('.hud-left .flex.gap-1');
            if (livesContainer) {
                livesContainer.innerHTML = Array.from({ length: game.maxLives }, (_, i) =>
                    `<span class="text-${i < game.lives ? 'rose-400' : 'slate-600'}">❤️</span>`
                ).join('');
            }
            const info = hud.querySelector('.hud-left .flex.gap-4');
            if (info) {
                info.innerHTML = `
                    <span>🏰 Lv.${data.level}/${data.maxLevel}</span>
                    <span>⭐ ${data.score}</span>
                    <span>🔥 x${data.combo}</span>
                `;
            }
        }, 200);
    }

    _renderBreathBar() {
        const container = this.container;
        if (!container) return;
        const bar = document.createElement('div');
        bar.className = 'breath-hud';
        bar.id = 'breath-hud';
        bar.innerHTML = `
            <span class="label">🌬️ 呼吸</span>
            <div class="breath-bar-track">
                <div class="breath-bar-fill" id="breath-fill" style="width:50%"></div>
            </div>
            <span class="value" id="breath-value">50</span>
        `;
        container.appendChild(bar);
        this._breathGameInterval = setInterval(() => {
            const v = this.breath.getValue();
            const fill = document.getElementById('breath-fill');
            const val = document.getElementById('breath-value');
            if (fill) fill.style.width = v + '%';
            if (val) val.textContent = v;
        }, 60);
    }

    _renderGameControls(game) {
        const container = this.container;
        if (!container) return;
        const controls = document.createElement('div');
        controls.className = 'absolute bottom-20 right-4 z-20 flex flex-col gap-2';
        controls.style.pointerEvents = 'auto';
        if (game instanceof WindPainterGame) {
            const btn = document.createElement('button');
            btn.className = 'btn-game bg-blue-500/30 hover:bg-blue-500/50';
            btn.textContent = '🖌️ 畫筆 ' + (game.penDown ? 'ON' : 'OFF');
            btn.addEventListener('click', () => {
                const state = game.togglePen();
                btn.textContent = '🖌️ 畫筆 ' + (state ? 'ON' : 'OFF');
            });
            controls.appendChild(btn);
        }
        if (game instanceof GlassHeartGame) {
            const btn = document.createElement('button');
            btn.className = 'btn-game bg-indigo-500/30 hover:bg-indigo-500/50';
            btn.textContent = '⚡ 切割 ' + (game.cutting ? 'ON' : 'OFF');
            btn.addEventListener('click', () => {
                const state = game.toggleCutting();
                btn.textContent = '⚡ 切割 ' + (state ? 'ON' : 'OFF');
            });
            controls.appendChild(btn);
        }
        const restBtn = document.createElement('button');
        restBtn.className = 'btn-game bg-amber-500/30 hover:bg-amber-500/50';
        restBtn.textContent = '🧘 休息';
        restBtn.addEventListener('click', () => {
            if (game && !game.isResting) game._triggerRest();
        });
        controls.appendChild(restBtn);
        container.appendChild(controls);
    }

    _updateRestUI(active) {
        const container = this.container;
        if (!container) return;
        const existing = container.querySelector('.rest-overlay');
        if (existing) existing.remove();
        if (!active) return;
        const overlay = document.createElement('div');
        overlay.className = 'rest-overlay';
        overlay.id = 'rest-overlay';
        overlay.innerHTML = `
            <div class="text-2xl font-light mb-2 text-slate-300">🧘 呼吸引導</div>
            <div class="breath-circle inhale" id="rest-circle">吸氣</div>
            <div class="text-sm text-slate-400" id="rest-timer">15s</div>
            <div class="text-xs text-slate-500 mt-4">強制休息 15 秒 · 不可跳過</div>
        `;
        container.appendChild(overlay);
        const game = this.gameInstance;
        if (!game) return;
        const circle = overlay.querySelector('#rest-circle');
        const timer = overlay.querySelector('#rest-timer');
        this._restUpdateInterval = setInterval(() => {
            if (!game || !game.isResting) { clearInterval(this._restUpdateInterval); return; }
            const phase = game.restPhase;
            if (circle) {
                circle.className = `breath-circle ${phase}`;
                const labels = { inhale: '吸氣 ↑', hold: '屏息 —', exhale: '吐氣 ↓' };
                circle.textContent = labels[phase] || '...';
            }
            if (timer) {
                const remaining = Math.ceil(game.restDuration - game.restTotalTime);
                timer.textContent = `${remaining}s`;
            }
        }, 200);
    }

    _showOverlay(title, btnText, onAction) {
        const container = this.container;
        if (!container) return;
        const overlay = document.createElement('div');
        overlay.className = 'absolute inset-0 z-40 bg-black/60 backdrop-blur-sm flex flex-col items-center justify-center rounded-2xl';
        overlay.innerHTML = `
            <div class="text-4xl mb-4">${title.includes('🏆') ? '🏆' : '💔'}</div>
            <div class="text-2xl font-bold mb-2">${title}</div>
            <button class="btn-game primary mt-4 px-8 py-3 text-lg">${btnText}</button>
        `;
        container.appendChild(overlay);
        overlay.querySelector('button').addEventListener('click', () => {
            overlay.remove();
            if (onAction) onAction();
        });
    }

    _showLevelUp(level) {
        const container = this.container;
        if (!container) return;
        const overlay = document.createElement('div');
        overlay.className = 'absolute inset-0 z-30 bg-black/40 backdrop-blur-sm flex flex-col items-center justify-center rounded-2xl pointer-events-none';
        overlay.style.animation = 'fadeIn 0.3s ease-out';
        overlay.innerHTML = `
            <div class="text-5xl mb-2">🎉</div>
            <div class="text-2xl font-bold text-amber-300">關卡 ${level-1} 完成！</div>
            <div class="text-sm text-slate-300 mt-1">進入第 ${level} 關</div>
        `;
        container.appendChild(overlay);
        setTimeout(() => overlay.remove(), 1500);
    }

    _setInputMode(mode) {
        this.breath.setMode(mode);
        if (mode === 'serial') { /* 已在按鈕事件處理 */ }
        Logger.log('input_mode_change', { mode });
    }

    _setupGlobalKeys() {
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && this.currentView === 'game') {
                if (this.gameInstance) { this.gameInstance.stop(); this._renderMenu(); }
            }
            if (e.key === ' ' && this.gameInstance) {
                e.preventDefault();
                const g = this.gameInstance;
                if (g instanceof WindPainterGame) g.togglePen();
                else if (g instanceof GlassHeartGame) g.toggleCutting();
            }
        });
    }

    _cleanup() {
        if (this._hudInterval) clearInterval(this._hudInterval);
        if (this._breathDisplayInterval) clearInterval(this._breathDisplayInterval);
        if (this._breathGameInterval) clearInterval(this._breathGameInterval);
        if (this._restUpdateInterval) clearInterval(this._restUpdateInterval);
        if (this._resizeObserver) this._resizeObserver.disconnect();
        if (this.gameInstance) { this.gameInstance.destroy(); this.gameInstance = null; }
    }
}

//  啟動

const app = new App();
window.__app = app;

console.log('🎮 選擇遊戲開始體驗呼吸控制！');

        .hud-overlay { position: absolute; top: 0; left: 0; right: 0; padding: 16px 20px; pointer-events: none; display: flex; justify-content: space-between; align-items: flex-start; z-index: 10; }
        .hud-left { display: flex; flex-direction: column; gap: 4px; background: rgba(0,0,0,0.5); backdrop-filter: blur(8px); padding: 10px 16px; border-radius: 16px; pointer-events: auto; color: #e2e8f0; font-size: 13px; line-height: 1.5; min-width: 140px; }
        .hud-right { display: flex; gap: 20px; background: rgba(0,0,0,0.5); backdrop-filter: blur(8px); padding: 10px 20px; border-radius: 16px; pointer-events: auto; color: #e2e8f0; font-size: 14px; font-weight: 500; }
        .hud-right .stat { display: flex; align-items: center; gap: 6px; }
        .hud-right .stat i { font-size: 16px; opacity: 0.7; }

        .breath-hud .label { color: #94a3b8; font-size: 12px; font-weight: 600; letter-spacing: 0.5px; white-space: nowrap; }
        .breath-hud .value { color: #f1f5f9; font-size: 14px; font-weight: 700; min-width: 36px; text-align: center; font-variant-numeric: tabular-nums; }
        .rest-overlay { position: absolute; inset: 0; z-index: 50; background: rgba(0,0,0,0.7); backdrop-filter: blur(12px); display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; border-radius: 24px; transition: opacity 0.4s; }

        .rest-overlay .breath-circle.inhale { transform: scale(1.4); border-color: #4ade80; }
        .rest-overlay .breath-circle.exhale { transform: scale(0.7); border-color: #f87171; }
        .rest-overlay .breath-circle.hold { transform: scale(1.0); border-color: #facc15; }
        .btn-game { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: #e2e8f0; padding: 6px 14px; border-radius: 10px; font-size: 13px; cursor: pointer; transition: all 0.2s; pointer-events: auto; backdrop-filter: blur(4px); }
        .btn-game:hover { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.2); }
        .btn-game.primary { background: #6366f1; border-color: #818cf8; color: white; }
        .btn-game.primary:hover { background: #4f46e5; }
        .btn-game.danger { background: #ef4444; border-color: #f87171; color: white; }
        .btn-game.danger:hover { background: #dc2626; }

        .btn-game.success:hover { background: #16a34a; }
        .game-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 20px; padding: 24px; transition: all 0.3s; cursor: pointer; backdrop-filter: blur(4px); color: #e2e8f0; }
        .game-card:hover { background: rgba(255,255,255,0.07); border-color: rgba(255,255,255,0.15); transform: translateY(-4px); box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
        .game-card .icon { font-size: 40px; margin-bottom: 12px; }
        .game-card .title { font-size: 18px; font-weight: 600; margin-bottom: 4px; }

        .menu-bg { background: radial-gradient(ellipse at 20% 50%, #1e1b4b, #0b0e14 70%); min-height: 100vh; }
        .fade-enter { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 999px; }
    </style>

<body>
<div id="root" class="menu-bg text-white p-4 md:p-8"></div>

<script type="module">
// ============================================================
//  核心工具 & 常量
// ============================================================
const $ = (sel, ctx = document) => ctx.querySelector(sel);
const $$ = (sel, ctx = document) => [...ctx.querySelectorAll(sel)];

const GAMES = {
    WIND_PAINTER: 'wind_painter',
    CANDLE_EXPEDITION: 'candle_expedition',
    MAGE_BREAKER: 'mage_breaker',
    DANDELION_EXPRESS: 'dandelion_express',
    GLASS_HEART: 'glass_heart'
};
const GAME_META = {
    [GAMES.WIND_PAINTER]: { label: '風之繪師', icon: '🎨', desc: '呼吸控制畫筆，描繪水彩形狀', theme: 'bg-gradient-to-br from-rose-100/10 via-amber-100/5 to-sky-100/10' },
    [GAMES.CANDLE_EXPEDITION]: { label: '燭光遠征', icon: '🕯️', desc: '呼吸控制燭火，照亮迷宮尋路', theme: 'bg-gradient-to-br from-amber-900/20 via-stone-800/10 to-slate-900/20' },
    [GAMES.MAGE_BREAKER]: { label: '魔導士破魔', icon: '⚔️', desc: '呼吸充能，釋放法術擊退敵人', theme: 'bg-gradient-to-br from-indigo-900/20 via-purple-800/10 to-fuchsia-900/20' },
    [GAMES.DANDELION_EXPRESS]: { label: '蒲公英快遞', icon: '🌿', desc: '呼吸控制飛行，送達花粉', theme: 'bg-gradient-to-br from-emerald-900/20 via-teal-800/10 to-cyan-900/20' },
    [GAMES.GLASS_HEART]: { label: '玻璃心大師', icon: '💎', desc: '呼吸控制壓力，雕刻水晶', theme: 'bg-gradient-to-br from-cyan-900/20 via-blue-800/10 to-indigo-900/20' }
};

// ============================================================
//  BreathController (支援 LowEnergy 解析)
// ============================================================
class BreathController {
    constructor() {
        this.value = 50;
        this.raw = 50;
        this.mode = 'simulate';
        this.listeners = [];
        this.serialPort = null;
        this.reader = null;
        this.simInterval = null;
        this.baseLine = 50;
        this.isRunning = false;
        this.keys = { up: false, down: false };
        this._boundKey = this._handleKey.bind(this);
    }

    startSimulate() {
        this.mode = 'simulate';
        this.isRunning = true;
        let phase = 0;
        if (this.simInterval) clearInterval(this.simInterval);
        this.simInterval = setInterval(() => {
            if (!this.isRunning) return;
            phase += 0.04;
            const raw = 55 + 30 * Math.sin(phase);
            const v = Math.max(0, Math.min(100, Math.round(raw)));
            this._setValue(v);
        }, 80);
        return this;
    }
    stopSimulate() {
        this.isRunning = false;
        if (this.simInterval) { clearInterval(this.simInterval); this.simInterval = null; }
        return this;
    }

    startKeyboard() {
        this.mode = 'keyboard';
        this.isRunning = true;
        document.addEventListener('keydown', this._boundKey);
        document.addEventListener('keyup', this._boundKey);
        this._setValue(50);
        this._keyboardLoop();
        return this;
    }
    stopKeyboard() {
        this.isRunning = false;
        document.removeEventListener('keydown', this._boundKey);
        document.removeEventListener('keyup', this._boundKey);
        if (this._kbdInterval) { clearInterval(this._kbdInterval); this._kbdInterval = null; }
        return this;
    }
    _handleKey(e) {
        const key = e.key.toLowerCase();
        if (key === 'arrowup' || key === 'w') { e.preventDefault(); this.keys.up = e.type === 'keydown'; }
        if (key === 'arrowdown' || key === 's') { e.preventDefault(); this.keys.down = e.type === 'keydown'; }
        if (key === ' ' && e.type === 'keydown') { e.preventDefault(); this._setValue(50); }
    }
    _keyboardLoop() {
        if (this._kbdInterval) clearInterval(this._kbdInterval);
        this._kbdInterval = setInterval(() => {
            if (!this.isRunning) return;
            let delta = 0;
            if (this.keys.up) delta = 2.5;
            if (this.keys.down) delta = -2.5;
            if (delta !== 0) {
                let v = this.value + delta;
                v = Math.max(0, Math.min(100, v));
                this._setValue(Math.round(v));
            }
        }, 50);
    }

    async connectSerial() {
        try {
            const port = await navigator.serial.requestPort();
            await port.open({ baudRate: 115200 });
            this.serialPort = port;
            this.mode = 'serial';
            this.isRunning = true;
            this.reader = port.readable.getReader();
            this._readSerialLoop();
            return true;
        } catch (e) {
            console.warn('Serial connection failed:', e);
            return false;
        }
    }

    // 修正版：解析 [DETECT] LowEnergy=數值
    async _readSerialLoop() {
        if (!this.reader) return;
        try {
            let buffer = '';
            while (this.isRunning) {
                const { value, done } = await this.reader.read();
                if (done) break;
                const chunk = new TextDecoder().decode(value);
                buffer += chunk;
                let lines = buffer.split(/\r?\n/);
                buffer = lines.pop() || '';

                for (const line of lines) {
                    const trimmed = line.trim();
                    if (trimmed.length === 0) continue;

                    let numericValue = null;

                    // 1) 優先解析 [DETECT] LowEnergy=數字
                    const detectMatch = trimmed.match(/\[DETECT\].*LowEnergy=(\d+)/);
                    if (detectMatch) {
                        const raw = parseInt(detectMatch[1], 10);
                        // 映射到 0-100 (最大值約 2,000,000)
                        const mapped = Math.round((raw / 2000000) * 100);
                        numericValue = Math.max(0, Math.min(100, mapped));
                        // 若 Flow=no 則壓低
                        if (trimmed.includes('Flow=no')) {
                            numericValue = Math.min(numericValue, 5);
                        }
                    }

                    // 2) 相容 V:數字
                    if (numericValue === null) {
                        const vMatch = trimmed.match(/V:\s*(\d+)/i);
                        if (vMatch) numericValue = parseInt(vMatch[1], 10);
                    }

                    // 3) 最後嘗試純數字
                    if (numericValue === null) {
                        const numMatch = trimmed.match(/(\d+)/);
                        if (numMatch) {
                            let raw = parseInt(numMatch[1], 10);
                            if (raw > 100) { // ADC 0-1023
                                numericValue = Math.round((raw / 1023) * 100);
                            } else {
                                numericValue = raw;
                            }
                        }
                    }

                    if (numericValue !== null) {
                        const finalVal = Math.max(0, Math.min(100, numericValue));
                        this._setValue(finalVal);
                        // console.log('[Breath]', finalVal);
                    }
                }
            }
        } catch (e) {
            console.warn('[Serial] 讀取錯誤:', e);
            this.isRunning = false;
            this.startSimulate();
        } finally {
            if (this.reader) {
                this.reader.releaseLock();
                this.reader = null;
            }
        }
    }

    async disconnectSerial() {
        this.isRunning = false;
        if (this.reader) { try { await this.reader.cancel(); } catch(_) {} this.reader = null; }
        if (this.serialPort) { try { await this.serialPort.close(); } catch(_) {} this.serialPort = null; }
        this.mode = 'simulate';
        return this;
    }

    async calibrate(duration = 2000) {
        const samples = [];
        return new Promise((resolve) => {
            const start = Date.now();
            const interval = setInterval(() => {
                samples.push(this.value);
                if (Date.now() - start >= duration) {
                    clearInterval(interval);
                    const avg = samples.reduce((a,b) => a+b, 0) / samples.length;
                    this.baseLine = Math.round(avg);
                    resolve(this.baseLine);
                }
            }, 100);
        });
    }

    _setValue(v) {
        v = Math.max(0, Math.min(100, Math.round(v)));
        if (this.value !== v) {
            this.value = v;
            this.raw = v;
            this._notify();
        }
    }
    _notify() { for (const fn of this.listeners) fn(this.value); }
    onValue(cb) { this.listeners.push(cb); return () => { this.listeners = this.listeners.filter(f => f !== cb); }; }
    getValue() { return this.value; }
    setMode(mode) {
        this.stopSimulate(); this.stopKeyboard(); this.disconnectSerial();
        this.mode = mode;
        if (mode === 'simulate') this.startSimulate();
        else if (mode === 'keyboard') this.startKeyboard();
        return this;
    }
    destroy() { this.stopSimulate(); this.stopKeyboard(); this.disconnectSerial(); this.listeners = []; }
}

// ============================================================
//  Logger (後端日誌)
// ============================================================
class Logger {
    static async log(event, data = {}) {
        try {
            const res = await fetch('/api/logs', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ timestamp: new Date().toISOString(), event, ...data, userAgent: navigator.userAgent })
            });
            return res.ok;
        } catch (_) { return false; }
    }
    static async gameEvent(gameId, action, payload = {}) { return this.log('game_event', { gameId, action, ...payload }); }
    static async scoreUpdate(gameId, score, combo) { return this.log('score_update', { gameId, score, combo }); }
    static async restTriggered(gameId) { return this.log('rest_triggered', { gameId }); }
    static async gameComplete(gameId, score, lives) { return this.log('game_complete', { gameId, score, lives }); }
}

// ============================================================
//  遊戲基底 GameBase (所有遊戲的父類)
// ============================================================
class GameBase {
    constructor(container, breathController, gameId) {
        this.container = container;
        this.breath = breathController;
        this.gameId = gameId;
        this.canvas = null;
        this.ctx = null;
        this.width = 0;
        this.height = 0;
        this.lives = 5;
        this.maxLives = 5;
        this.score = 0;
        this.combo = 0;
        this.level = 1;
        this.maxLevel = 5;
        this.isPlaying = false;
        this.isPaused = false;
        this.isResting = false;
        this.restTimer = 0;
        this.restDuration = 15;
        this.restCooldown = 60;
        this.restCooldownCounter = 0;
        this.successCount = 0;
        this.successThreshold = 3;
        this.totalSuccesses = 0;
        this.failCount = 0;
        this.failThreshold = 5;
        this.frameId = null;
        this._unsubBreath = null;
        this._lastBreath = 50;
        this._restCallback = null;
        this._onComplete = null;
        this.gameTitle = GAME_META[gameId]?.label || gameId;
        this.breathValue = 50;
        this.hudElements = {};
        this.restPhase = 'inhale';
        this.restPhaseTimer = 0;
        this.restTotalTime = 0;
        this._loop = this._loop.bind(this);
    }

    init(width, height) {
        this.width = width;
        this.height = height;
        this.canvas = document.createElement('canvas');
        this.canvas.width = width;
        this.canvas.height = height;
        this.canvas.style.display = 'block';
        this.canvas.style.width = '100%';
        this.canvas.style.height = '100%';
        this.container.prepend(this.canvas);
        this.ctx = this.canvas.getContext('2d');
        this._unsubBreath = this.breath.onValue((v) => {
            this.breathValue = v;
            this._lastBreath = v;
            this.onBreath(v);
        });
        this.onInit();
        return this;
    }

    start() {
        if (this.isPlaying) return;
        this.isPlaying = true;
        this.isPaused = false;
        this.onStart();
        this._loop();
        Logger.gameEvent(this.gameId, 'start', { level: this.level });
        return this;
    }
    pause() { this.isPaused = true; if (this.frameId) { cancelAnimationFrame(this.frameId); this.frameId = null; } return this; }
    resume() { if (!this.isPaused) return; this.isPaused = false; this._loop(); return this; }
    stop() {
        this.isPlaying = false;
        if (this.frameId) { cancelAnimationFrame(this.frameId); this.frameId = null; }
        if (this._unsubBreath) { this._unsubBreath(); this._unsubBreath = null; }
        this.onStop();
        return this;
    }
    destroy() {
        this.stop();
        if (this.canvas && this.canvas.parentNode) { this.canvas.parentNode.removeChild(this.canvas); }
        this.onDestroy();
    }

    _loop(timestamp) {
        if (!this.isPlaying || this.isPaused) return;
        this.frameId = requestAnimationFrame(this._loop);
        const dt = 1 / 60;
        this._updateRest(dt);
        if (!this.isResting) { this.update(dt); }
        this.draw();
    }

    _updateRest(dt) {
        if (!this.isResting) {
            this.restCooldownCounter += dt;
            const shouldRest = this.restCooldownCounter >= this.restCooldown ||
                (this.successCount > 0 && this.successCount % 3 === 0);
            if (shouldRest && this.isPlaying && !this.isPaused) {
                this._triggerRest();
            }
            return;
        }
        this.restTotalTime += dt;
        this.restPhaseTimer += dt;
        const cycleDuration = 10;
        const phase = this.restTotalTime % cycleDuration;
        if (phase < 4) this.restPhase = 'inhale';
        else if (phase < 6) this.restPhase = 'hold';
        else this.restPhase = 'exhale';
        if (this.restTotalTime >= this.restDuration) {
            this._endRest();
        }
    }

    _triggerRest() {
        if (this.isResting) return;
        this.isResting = true;
        this.restTotalTime = 0;
        this.restPhase = 'inhale';
        this.restPhaseTimer = 0;
        this.restCooldownCounter = 0;
        this.pause();
        Logger.restTriggered(this.gameId);
        if (this._restCallback) this._restCallback(true);
        this.onRestStart();
    }
    _endRest() {
        this.isResting = false;
        this.restTotalTime = 0;
        this.restPhase = 'inhale';
        this.resume();
        if (this._restCallback) this._restCallback(false);
        this.onRestEnd();
    }

    // 子類覆寫
    onInit() {}
    onStart() {}
    onStop() {}
    onDestroy() {}
    onBreath(v) {}
    update(dt) {}
    draw() {}
    onRestStart() {}
    onRestEnd() {}

    addScore(pts) {
        this.score += pts;
        Logger.scoreUpdate(this.gameId, this.score, this.combo);
        this.onScoreChange();
    }
    addCombo() {
        this.combo++;
        if (this.combo >= 5) this.addScore(5);
        this.onComboChange();
    }
    resetCombo() { this.combo = 0; this.onComboChange(); }
    loseLife() {
        this.lives--;
        if (this.lives <= 0) { this.lives = 0; this.gameOver(); }
        this.onLifeChange();
        return this.lives;
    }
    addLife() { if (this.lives < this.maxLives) { this.lives++; this.onLifeChange(); } return this.lives; }
    gameOver() {
        this.isPlaying = false;
        Logger.gameComplete(this.gameId, this.score, this.lives);
        this.onGameOver();
    }
    levelComplete() {
        if (this.level >= this.maxLevel) { this.allComplete(); return; }
        this.level++;
        this.successCount = 0;
        this.onLevelUp();
        Logger.gameEvent(this.gameId, 'level_up', { level: this.level });
    }
    allComplete() {
        this.isPlaying = false;
        Logger.gameComplete(this.gameId, this.score, this.lives);
        this.onAllComplete();
    }

    onScoreChange() {}
    onComboChange() {}
    onLifeChange() {}
    onGameOver() {}
    onLevelUp() {}
    onAllComplete() {}
    setRestCallback(fn) { this._restCallback = fn; }

    getHUDData() {
        return {
            title: this.gameTitle,
            level: this.level,
            maxLevel: this.maxLevel,
            score: this.score,
            combo: this.combo,
            lives: this.lives,
            maxLives: this.maxLives,
            breath: this.breathValue,
            isResting: this.isResting,
            restPhase: this.restPhase,
            restTotal: this.restTotalTime,
            restDuration: this.restDuration,
        };
    }

    roundRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
    }
}

// ============================================================
//  遊戲一：風之繪師
// ============================================================
class WindPainterGame extends GameBase {
    constructor(container, breath) {
        super(container, breath, GAMES.WIND_PAINTER);
        this.shapes = [
            { name: '圓', points: this._genCircle(0.4) },
            { name: '葉', points: this._genLeaf() },
            { name: '雲', points: this._genCloud() },
            { name: '蝶', points: this._genButterfly() },
            { name: '花+葉', points: this._genFlowerLeaf() }
        ];
        this.currentShape = null;
        this.shapePoints = [];
        this.shapeBounds = { minX: 0, maxX: 0, minY: 0, maxY: 0 };
        this.paintedPixels = new Set();
        this.totalPixels = 0;
        this.completedPixels = 0;
        this.penX = 0;
        this.penY = 0;
        this.penDown = false;
        this.strokeCount = 0;
        this.strokesPerPainting = 3;
        this.paintingsDone = 0;
        this.paintingsTarget = 5;
        this.mistakes = 0;
        this.maxMistakes = 5;
        this.brushSize = 4;
        this.brushOpacity = 0.6;
        this.hue = 200;
        this.targetShape = null;
        this.showGuide = true;
        this.particles = [];
        this.isDrawing = false;
        this.lastBreathVal = 50;
        this.hasFineBrush = false;
        this.hasPalette = false;
        this.itemTimer = 0;
    }

    onInit() {
        this.currentShape = this.shapes[0];
        this._loadShape(0);
        this.penX = this.width / 2;
        this.penY = this.height / 2;
        this.penDown = false;
    }

    _loadShape(index) {
        const pts = this.shapes[index % this.shapes.length].points;
        this.shapePoints = pts;
        let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        for (const p of pts) {
            if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
            if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y;
        }
        const pad = 30;
        this.shapeBounds = { minX: minX - pad, maxX: maxX + pad, minY: minY - pad, maxY: maxY + pad };
        this.totalPixels = pts.length;
        this.completedPixels = 0;
        this.paintedPixels = new Set();
        this.strokeCount = 0;
        this.mistakes = 0;
        this.penDown = false;
        this.targetShape = pts;
    }

    _genCircle(radius) {
        const pts = [];
        const cx = this.width / 2, cy = this.height / 2;
        const r = Math.min(this.width, this.height) * 0.3 * radius;
        for (let i = 0; i < 180; i++) {
            const a = (i / 180) * Math.PI * 2;
            pts.push({ x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) });
        }
        return pts;
    }
    _genLeaf() {
        const pts = [];
        const cx = this.width / 2, cy = this.height / 2;
        for (let i = 0; i < 120; i++) {
            const t = (i / 120) * Math.PI * 2;
            const r = Math.min(this.width, this.height) * 0.25 * (0.6 + 0.4 * Math.sin(t * 2 + 1.2));
            pts.push({ x: cx + r * Math.cos(t), y: cy + r * Math.sin(t) * 1.5 });
        }
        return pts;
    }
    _genCloud() {
        const pts = [];
        const cx = this.width / 2, cy = this.height / 2;
        const base = Math.min(this.width, this.height) * 0.2;
        for (let i = 0; i < 150; i++) {
            const t = (i / 150) * Math.PI * 2;
            const r = base * (0.7 + 0.3 * Math.sin(t * 3 + 0.5) + 0.2 * Math.sin(t * 5 + 2.1));
            pts.push({ x: cx + r * Math.cos(t) * 1.1, y: cy + r * Math.sin(t) * 0.7 });
        }
        return pts;
    }
    _genButterfly() {
        const pts = [];
        const cx = this.width / 2, cy = this.height / 2;
        const base = Math.min(this.width, this.height) * 0.2;
        for (let i = 0; i < 200; i++) {
            const t = (i / 200) * Math.PI * 2;
            const r = base * (0.8 + 0.5 * Math.sin(t * 2 + 0.3) + 0.3 * Math.sin(t * 4 + 1.7));
            const x = cx + r * Math.cos(t) * 1.3;
            const y = cy + r * Math.sin(t) * 0.9 + 15 * Math.sin(t * 2);
            pts.push({ x, y });
        }
        return pts;
    }
    _genFlowerLeaf() {
        const pts = [];
        const cx = this.width / 2, cy = this.height / 2;
        const base = Math.min(this.width, this.height) * 0.18;
        for (let i = 0; i < 120; i++) {
            const t = (i / 120) * Math.PI * 2;
            const r = base * (0.9 + 0.4 * Math.sin(t * 5 + 0.2));
            pts.push({ x: cx + r * Math.cos(t) * 1.2, y: cy + r * Math.sin(t) * 1.1 });
        }
        for (let i = 0; i < 80; i++) {
            const t = (i / 80) * Math.PI * 2 + 0.5;
            const r = base * 0.7 * (0.8 + 0.2 * Math.sin(t * 2 + 1.0));
            pts.push({ x: cx + 60 + r * Math.cos(t) * 1.0, y: cy + 40 + r * Math.sin(t) * 0.6 });
        }
        return pts;
    }

    onBreath(v) {
        this.brushSize = 2 + (v / 100) * 18;
        this.brushOpacity = 0.3 + (v / 100) * 0.7;
        this.hue = 200 + (v / 100) * 60;
        if (this.isPlaying && !this.isResting) {
            const targetX = this.penX + (v - this.lastBreathVal) * 1.2;
            const targetY = this.penY + (v - this.lastBreathVal) * 0.8;
            this.penX = Math.max(0, Math.min(this.width, targetX));
            this.penY = Math.max(0, Math.min(this.height, targetY));
            this.lastBreathVal = v;
            if (this.penDown) { this._paintAt(this.penX, this.penY); }
        }
    }

    _paintAt(x, y) {
        const idx = Math.round(x) + ',' + Math.round(y);
        if (this.paintedPixels.has(idx)) return;
        const inside = this._isInsideShape(x, y);
        if (inside) {
            this.paintedPixels.add(idx);
            this.completedPixels++;
            this._spawnParticles(x, y, '#4ade80');
            const progress = this.completedPixels / this.totalPixels;
            if (progress >= 0.3 && this.strokeCount < this.strokesPerPainting) {
                this.strokeCount++;
                this.addCombo();
                this.addScore(15);
                this.successCount++;
                Logger.gameEvent(this.gameId, 'stroke_complete', { stroke: this.strokeCount });
                this.completedPixels = 0;
                this.paintedPixels = new Set();
                for (let i = 0; i < 30; i++) {
                    this._spawnParticles(
                        x + (Math.random() - 0.5) * 60,
                        y + (Math.random() - 0.5) * 60,
                        ['#facc15','#f87171','#60a5fa','#a78bfa'][Math.floor(Math.random()*4)]
                    );
                }
                if (this.strokeCount >= this.strokesPerPainting) {
                    this.paintingsDone++;
                    this.strokeCount = 0;
                    this.addScore(30);
                    if (this.paintingsDone >= this.paintingsTarget) {
                        this.levelComplete();
                    } else {
                        const nextIdx = (this.paintingsDone) % this.shapes.length;
                        this._loadShape(nextIdx);
                    }
                    Logger.gameEvent(this.gameId, 'painting_complete', { paintings: this.paintingsDone });
                }
            }
        } else {
            this.mistakes++;
            this._spawnParticles(x, y, '#ef4444');
            if (this.mistakes >= this.maxMistakes) {
                this.mistakes = 0;
                this.loseLife();
                this.resetCombo();
            }
        }
    }

    _isInsideShape(x, y) {
        const pts = this.shapePoints;
        let inside = false;
        for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
            const xi = pts[i].x, yi = pts[i].y;
            const xj = pts[j].x, yj = pts[j].y;
            const intersect = ((yi > y) !== (yj > y)) &&
                (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
            if (intersect) inside = !inside;
        }
        return inside;
    }

    _spawnParticles(x, y, color) {
        for (let i = 0; i < 6; i++) {
            this.particles.push({
                x, y,
                vx: (Math.random() - 0.5) * 6,
                vy: (Math.random() - 0.5) * 6 - 2,
                life: 1,
                decay: 0.02 + Math.random() * 0.02,
                size: 2 + Math.random() * 4,
                color
            });
        }
    }

    update(dt) {
        for (let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.x += p.vx; p.y += p.vy; p.vy += 0.05;
            p.life -= p.decay;
            if (p.life <= 0) this.particles.splice(i, 1);
        }
        this.itemTimer += dt;
        if (this.itemTimer > 10) {
            this.itemTimer = 0;
            if (Math.random() > 0.5) {
                this.hasFineBrush = true;
                setTimeout(() => { this.hasFineBrush = false; }, 5000);
            } else {
                this.hasPalette = true;
                setTimeout(() => { this.hasPalette = false; }, 5000);
            }
        }
    }

    draw() {
        const ctx = this.ctx, W = this.width, H = this.height;
        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = '#f5efe8';
        ctx.fillRect(0, 0, W, H);
        for (let i = 0; i < 300; i++) {
            ctx.fillStyle = `rgba(200,185,170,${0.03 + Math.random() * 0.05})`;
            ctx.fillRect(Math.random() * W, Math.random() * H, 2 + Math.random() * 4, 1 + Math.random() * 2);
        }
        if (this.targetShape && this.showGuide) {
            ctx.save();
            ctx.shadowColor = 'rgba(250,204,21,0.2)';
            ctx.shadowBlur = 30;
            ctx.beginPath();
            const pts = this.targetShape;
            ctx.moveTo(pts[0].x, pts[0].y);
            for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
            ctx.closePath();
            ctx.strokeStyle = 'rgba(250,204,21,0.25)';
            ctx.lineWidth = 2;
            ctx.setLineDash([6, 8]);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.restore();
        }
        if (this.paintedPixels.size > 0) {
            ctx.save();
            for (const key of this.paintedPixels) {
                const [x, y] = key.split(',').map(Number);
                ctx.fillStyle = `hsla(${this.hue}, 70%, 60%, ${this.brushOpacity * 0.7})`;
                ctx.beginPath();
                ctx.arc(x, y, this.brushSize * 0.5, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }
        ctx.save();
        const grad = ctx.createRadialGradient(this.penX, this.penY, 0, this.penX, this.penY, this.brushSize);
        const alpha = this.penDown ? this.brushOpacity : 0.3;
        grad.addColorStop(0, `hsla(${this.hue}, 80%, 70%, ${alpha})`);
        grad.addColorStop(1, `hsla(${this.hue + 20}, 70%, 50%, ${alpha * 0.4})`);
        ctx.shadowColor = `hsla(${this.hue}, 80%, 60%, 0.3)`;
        ctx.shadowBlur = 20;
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(this.penX, this.penY, this.brushSize, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        for (const p of this.particles) {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#4a3f3a';
        ctx.font = '13px sans-serif';
        ctx.fillText(`🎨 畫作 ${this.paintingsDone}/${this.paintingsTarget}  筆觸 ${this.strokeCount}/${this.strokesPerPainting}`, 20, 30);
        if (this.hasFineBrush) { ctx.fillStyle = '#facc15'; ctx.fillText('🖌️ 細筆 (失誤-1)', 20, 52); }
        if (this.hasPalette) { ctx.fillStyle = '#a78bfa'; ctx.fillText('🎨 調色盤', 20, 74); }
    }

    onRestStart() { this.penDown = false; }
    onRestEnd() { this.penDown = true; }
    togglePen() { this.penDown = !this.penDown; if (this.penDown) this.lastBreathVal = this.breathValue; return this.penDown; }
}

// ============================================================
//  遊戲二：燭光遠征
// ============================================================
class CandleExpeditionGame extends GameBase {
    constructor(container, breath) {
        super(container, breath, GAMES.CANDLE_EXPEDITION);
        this.maze = [];
        this.mazeSize = 15;
        this.cellSize = 0;
        this.playerX = 1;
        this.playerY = 1;
        this.exitX = 13;
        this.exitY = 13;
        this.lightRadius = 80;
        this.fuel = 100;
        this.maxFuel = 100;
        this.fuelConsumption = 0.3;
        this.gems = 0;
        this.gemsTarget = 3;
        this.mazeOffsetX = 0;
        this.mazeOffsetY = 0;
        this.explored = new Set();
        this.fogOfWar = true;
        this.hasCompass = false;
        this.compassTimer = 0;
        this.trail = [];
        this.mazeGenerated = false;
        this.moveCooldown = 0;
        this.keys = { up: false, down: false, left: false, right: false };
        this._boundKey = this._handleKey.bind(this);
    }

    onInit() {
        this._generateMaze(this.mazeSize);
        this.cellSize = Math.min(this.width, this.height) / (this.mazeSize + 2);
        this.mazeOffsetX = (this.width - this.cellSize * this.mazeSize) / 2;
        this.mazeOffsetY = (this.height - this.cellSize * this.mazeSize) / 2;
        this.playerX = 1; this.playerY = 1;
        this.exitX = this.mazeSize - 2; this.exitY = this.mazeSize - 2;
        this.fuel = 100; this.gems = 0;
        this.explored = new Set(); this.trail = [];
        this.hasCompass = false; this.compassTimer = 0;
        document.addEventListener('keydown', this._boundKey);
        document.addEventListener('keyup', this._boundKey);
    }

    _generateMaze(size) {
        const grid = Array.from({ length: size }, () => Array(size).fill(1));
        const stack = [];
        const startX = 1, startY = 1;
        grid[startY][startX] = 0;
        stack.push([startX, startY]);
        const dirs = [[0,-2],[0,2],[-2,0],[2,0]];
        while (stack.length) {
            const [cx, cy] = stack[stack.length - 1];
            const neighbors = [];
            for (const [dx, dy] of dirs) {
                const nx = cx + dx, ny = cy + dy;
                if (nx > 0 && nx < size-1 && ny > 0 && ny < size-1 && grid[ny][nx] === 1) {
                    neighbors.push([nx, ny, dx, dy]);
                }
            }
            if (neighbors.length) {
                const [nx, ny, dx, dy] = neighbors[Math.floor(Math.random() * neighbors.length)];
                grid[cy + dy/2][cx + dx/2] = 0;
                grid[ny][nx] = 0;
                stack.push([nx, ny]);
            } else {
                stack.pop();
            }
        }
        grid[this.exitY][this.exitX] = 0;
        grid[this.exitY - 1][this.exitX] = 0;
        grid[this.exitY][this.exitX - 1] = 0;
        this.maze = grid;
        this.mazeGenerated = true;
    }

    onBreath(v) {
        this.lightRadius = 40 + (v / 100) * 120;
        if (this.isPlaying && !this.isResting) {
            const consumption = 0.15 + (v / 100) * 0.6;
            this.fuel -= consumption * 0.05;
            if (this.fuel <= 0) {
                this.fuel = 0;
                this.loseLife();
                this.fuel = 80;
                this.playerX = 1; this.playerY = 1;
                this.explored = new Set();
                this.resetCombo();
            }
        }
    }

    _handleKey(e) {
        const key = e.key;
        if (['arrowup','arrowdown','arrowleft','arrowright'].includes(key)) {
            e.preventDefault();
            this.keys[key.replace('arrow','').toLowerCase()] = e.type === 'keydown';
        }
    }

    update(dt) {
        this.moveCooldown -= dt;
        if (this.moveCooldown > 0) return;
        let dx = 0, dy = 0;
        if (this.keys.up) dy = -1;
        else if (this.keys.down) dy = 1;
        else if (this.keys.left) dx = -1;
        else if (this.keys.right) dx = 1;
        if (dx !== 0 || dy !== 0) {
            this.moveCooldown = 0.12;
            const nx = this.playerX + dx, ny = this.playerY + dy;
            if (nx >= 0 && nx < this.mazeSize && ny >= 0 && ny < this.mazeSize &&
                this.maze[ny][nx] === 0) {
                this.playerX = nx; this.playerY = ny;
                this.trail.push({x: nx, y: ny});
                if (this.trail.length > 30) this.trail.shift();
                this.explored.add(`${nx},${ny}`);
                if (nx === this.exitX && ny === this.exitY) {
                    this.gems++;
                    this.addScore(25);
                    this.addCombo();
                    this.successCount++;
                    Logger.gameEvent(this.gameId, 'gem_collected', { gems: this.gems });
                    if (this.gems >= this.gemsTarget) {
                        this.levelComplete();
                    } else {
                        this.playerX = 1; this.playerY = 1;
                        this.fuel = Math.min(this.maxFuel, this.fuel + 30);
                        this.explored = new Set();
                        this.explored.add('1,1');
                    }
                }
                if (Math.random() < 0.01) {
                    this.hasCompass = true;
                    this.compassTimer = 5;
                }
            } else {
                if (this.maze[ny] && this.maze[ny][nx] === 1) {
                    this.loseLife();
                    this.resetCombo();
                    this.playerX = 1; this.playerY = 1;
                    this.explored = new Set();
                    this.explored.add('1,1');
                    this.fuel = Math.min(this.maxFuel, this.fuel + 20);
                }
            }
        }
        if (this.hasCompass) {
            this.compassTimer -= dt;
            if (this.compassTimer <= 0) this.hasCompass = false;
        }
        this.fuel -= 0.02;
        if (this.fuel <= 0) {
            this.fuel = 0;
            this.loseLife();
            this.fuel = 80;
            this.playerX = 1; this.playerY = 1;
            this.explored = new Set();
            this.explored.add('1,1');
            this.resetCombo();
        }
    }

    draw() {
        const ctx = this.ctx, W = this.width, H = this.height;
        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = '#0a0808';
        ctx.fillRect(0, 0, W, H);
        const cs = this.cellSize, ox = this.mazeOffsetX, oy = this.mazeOffsetY;
        const px = this.playerX, py = this.playerY;
        const viewRadius = Math.ceil(this.lightRadius / cs) + 2;
        ctx.save();
        for (let y = 0; y < this.mazeSize; y++) {
            for (let x = 0; x < this.mazeSize; x++) {
                const dist = Math.sqrt((x - px) ** 2 + (y - py) ** 2);
                const isLit = dist < viewRadius || this.explored.has(`${x},${y}`);
                if (isLit) {
                    const cx = ox + x * cs, cy = oy + y * cs;
                    if (this.maze[y][x] === 1) {
                        ctx.fillStyle = '#3a2f2a';
                        ctx.fillRect(cx, cy, cs, cs);
                        ctx.fillStyle = '#4a3f3a';
                        ctx.fillRect(cx + 2, cy + 2, cs - 4, cs - 4);
                        ctx.strokeStyle = '#2a1f1a';
                        ctx.lineWidth = 0.5;
                        ctx.strokeRect(cx + 4, cy + 4, cs - 8, cs - 8);
                    } else {
                        ctx.fillStyle = '#1a1512';
                        ctx.fillRect(cx, cy, cs, cs);
                    }
                }
            }
        }
        const ex = ox + this.exitX * cs, ey = oy + this.exitY * cs;
        const exitDist = Math.sqrt((this.exitX - px) ** 2 + (this.exitY - py) ** 2);
        if (exitDist < viewRadius || this.explored.has(`${this.exitX},${this.exitY}`)) {
            ctx.save();
            ctx.shadowColor = 'rgba(250,204,21,0.4)';
            ctx.shadowBlur = 30;
            ctx.fillStyle = 'rgba(250,204,21,0.3)';
            ctx.beginPath();
            ctx.arc(ex + cs/2, ey + cs/2, cs * 0.4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#facc15';
            ctx.font = `${cs * 0.6}px serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🚪', ex + cs/2, ey + cs/2 + 2);
            ctx.restore();
        }
        const cx2 = ox + px * cs + cs/2, cy2 = oy + py * cs + cs/2;
        const grad = ctx.createRadialGradient(cx2, cy2, 0, cx2, cy2, this.lightRadius);
        grad.addColorStop(0, 'rgba(255,200,150,0.0)');
        grad.addColorStop(0.6, 'rgba(255,150,80,0.02)');
        grad.addColorStop(1, 'rgba(0,0,0,0.85)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);
        const flameSize = 8 + (this.breathValue / 100) * 20;
        ctx.save();
        ctx.shadowColor = 'rgba(255,180,50,0.6)';
        ctx.shadowBlur = 60;
        const grad2 = ctx.createRadialGradient(cx2, cy2 - 4, 0, cx2, cy2 - 4, flameSize);
        grad2.addColorStop(0, 'rgba(255,230,200,1)');
        grad2.addColorStop(0.3, 'rgba(255,200,100,0.9)');
        grad2.addColorStop(0.7, 'rgba(255,120,40,0.6)');
        grad2.addColorStop(1, 'rgba(255,80,20,0)');
        ctx.fillStyle = grad2;
        ctx.beginPath();
        ctx.arc(cx2, cy2 - 4, flameSize, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        ctx.restore();
        if (this.hasCompass) {
            ctx.save();
            ctx.fillStyle = 'rgba(255,215,0,0.9)';
            ctx.font = '18px sans-serif';
            ctx.textAlign = 'right';
            const angle = Math.atan2(this.exitY - py, this.exitX - px);
            const dirX = Math.cos(angle), dirY = Math.sin(angle);
            ctx.fillText('🧭', W - 30, 30);
            ctx.strokeStyle = 'rgba(255,215,0,0.3)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(cx2, cy2);
            ctx.lineTo(cx2 + dirX * 60, cy2 + dirY * 60);
            ctx.stroke();
            ctx.restore();
        }
        ctx.fillStyle = 'rgba(255,200,150,0.8)';
        ctx.font = '12px sans-serif';
        ctx.fillText(`🪔 ${Math.round(this.fuel)}%`, 20, 30);
        ctx.fillText(`💎 ${this.gems}/${this.gemsTarget}`, 20, 50);
    }

    onRestStart() { this.keys = { up: false, down: false, left: false, right: false }; }
    onRestEnd() {}
    onDestroy() { document.removeEventListener('keydown', this._boundKey); document.removeEventListener('keyup', this._boundKey); }
    onGameOver() { this.keys = { up: false, down: false, left: false, right: false }; }
}

// ============================================================
//  遊戲三：魔導士破魔
// ============================================================
class MageBreakerGame extends GameBase {
    constructor(container, breath) {
        super(container, breath, GAMES.MAGE_BREAKER);
        this.charge = 0;
        this.maxCharge = 100;
        this.chargeSpeed = 0.5;
        this.enemies = [];
        this.wave = 0;
        this.maxWaves = 3;
        this.enemiesPerWave = 4;
        this.enemiesSpawned = 0;
        this.spawnCooldown = 0;
        this.waveDelay = 0;
        this.isWaveActive = false;
        this.magicParticles = [];
        this.circleRadius = 80;
        this.circleX = 0;
        this.circleY = 0;
        this.spellCooldown = 0;
        this.hasCrystal = false;
        this.hasSpellbook = false;
        this.itemTimers = {};
        this.enemyTypes = ['normal','fast','ranged'];
        this.bossMode = false;
    }

    onInit() {
        this.circleX = this.width / 2;
        this.circleY = this.height / 2;
        this.circleRadius = Math.min(this.width, this.height) * 0.15;
        this.enemies = [];
        this.wave = 0;
        this.charge = 0;
        this.isWaveActive = false;
        this.waveDelay = 0.5;
        this.spawnCooldown = 0;
        this.enemiesSpawned = 0;
        this.magicParticles = [];
        this.spellCooldown = 0;
        this._startWave();
    }

    _startWave() {
        this.wave++;
        if (this.wave > this.maxWaves) { this.levelComplete(); return; }
        this.isWaveActive = true;
        this.enemiesSpawned = 0;
        this.spawnCooldown = 0;
        const count = this.wave === 1 ? 3 : (this.wave === 2 ? 4 : 5);
        this.enemiesPerWave = count;
        if (this.wave === this.maxWaves) { this.bossMode = true; this.enemiesPerWave = 1; }
        else { this.bossMode = false; }
        Logger.gameEvent(this.gameId, 'wave_start', { wave: this.wave, count: this.enemiesPerWave });
    }

    onBreath(v) {
        if (this.isPlaying && !this.isResting && this.isWaveActive) {
            const speed = 0.3 + (v / 100) * 1.2;
            this.charge += speed;
            if (this.charge >= this.maxCharge) {
                this.charge = this.maxCharge;
                this._castSpell();
            }
        }
    }

    _castSpell() {
        if (this.spellCooldown > 0) return;
        if (this.enemies.length === 0) return;
        this.charge = 0;
        this.spellCooldown = 0.4;
        let target = null;
        let minDist = Infinity;
        for (const e of this.enemies) {
            const d = Math.hypot(e.x - this.circleX, e.y - this.circleY);
            if (d < minDist) { minDist = d; target = e; }
        }
        if (!target) return;
        const damage = this.hasSpellbook ? 40 : (20 + Math.random() * 15);
        target.hp -= damage;
        for (let i = 0; i < 20; i++) {
            this.magicParticles.push({
                x: target.x, y: target.y,
                vx: (Math.random() - 0.5) * 10,
                vy: (Math.random() - 0.5) * 10 - 4,
                life: 1,
                decay: 0.03 + Math.random() * 0.02,
                size: 3 + Math.random() * 5,
                color: ['#a78bfa','#818cf8','#c084fc','#f472b6'][Math.floor(Math.random()*4)]
            });
        }
        if (target.hp <= 0) {
            this.enemies = this.enemies.filter(e => e !== target);
            this.addScore(15 + this.wave * 5);
            this.addCombo();
            this.successCount++;
            if (Math.random() < 0.25) {
                if (Math.random() > 0.5) {
                    this.hasCrystal = true;
                    this.charge = Math.min(this.maxCharge, this.charge + 50);
                    setTimeout(() => { this.hasCrystal = false; }, 3000);
                } else {
                    this.hasSpellbook = true;
                    setTimeout(() => { this.hasSpellbook = false; }, 4000);
                }
            }
            for (let i = 0; i < 30; i++) {
                this.magicParticles.push({
                    x: target.x, y: target.y,
                    vx: (Math.random() - 0.5) * 15,
                    vy: (Math.random() - 0.5) * 15 - 5,
                    life: 1,
                    decay: 0.015 + Math.random() * 0.02,
                    size: 2 + Math.random() * 6,
                    color: ['#facc15','#f87171','#34d399','#60a5fa'][Math.floor(Math.random()*4)]
                });
            }
            Logger.gameEvent(this.gameId, 'enemy_defeated', { wave: this.wave, remaining: this.enemies.length });
        }
        if (this.enemies.length === 0 && this.isWaveActive) {
            this.isWaveActive = false;
            this.addScore(30);
            if (this.wave >= this.maxWaves) {
                this.levelComplete();
            } else {
                setTimeout(() => this._startWave(), 600);
            }
        }
    }

    update(dt) {
        if (this.spellCooldown > 0) this.spellCooldown -= dt;
        if (this.isWaveActive && this.enemiesSpawned < this.enemiesPerWave) {
            this.spawnCooldown -= dt;
            if (this.spawnCooldown <= 0) {
                this._spawnEnemy();
                this.enemiesSpawned++;
                this.spawnCooldown = 0.6 - this.wave * 0.05;
            }
        }
        for (const e of this.enemies) {
            const dx = this.circleX - e.x, dy = this.circleY - e.y;
            const dist = Math.hypot(dx, dy);
            if (dist > 0) {
                const speed = e.type === 'fast' ? 70 : (e.type === 'ranged' ? 25 : 45);
                e.x += (dx / dist) * speed * dt;
                e.y += (dy / dist) * speed * dt;
            }
            if (e.type === 'ranged' && e.attackCooldown > 0) e.attackCooldown -= dt;
            if (e.type === 'ranged' && e.attackCooldown <= 0) {
                e.attackCooldown = 2;
                if (Math.random() < 0.3) { this.loseLife(); this.resetCombo(); }
            }
            if (dist < this.circleRadius + 20) {
                this.loseLife(); this.resetCombo();
                this.enemies = this.enemies.filter(ee => ee !== e);
            }
        }
        for (let i = this.magicParticles.length - 1; i >= 0; i--) {
            const p = this.magicParticles[i];
            p.x += p.vx * dt * 60;
            p.y += p.vy * dt * 60;
            p.vy += 0.2;
            p.life -= p.decay;
            if (p.life <= 0) this.magicParticles.splice(i, 1);
        }
        for (const key of Object.keys(this.itemTimers)) {
            this.itemTimers[key] -= dt;
            if (this.itemTimers[key] <= 0) {
                delete this.itemTimers[key];
                if (key === 'crystal') this.hasCrystal = false;
                if (key === 'spellbook') this.hasSpellbook = false;
            }
        }
    }

    _spawnEnemy() {
        const angle = Math.random() * Math.PI * 2;
        const dist = 150 + Math.random() * 120;
        const x = this.circleX + Math.cos(angle) * dist;
        const y = this.circleY + Math.sin(angle) * dist;
        let type = 'normal';
        if (this.wave >= 2 && Math.random() < 0.3) type = 'fast';
        if (this.wave >= 3 && Math.random() < 0.3) type = 'ranged';
        if (this.bossMode) type = 'boss';
        const hp = type === 'boss' ? 80 : (type === 'fast' ? 20 : (type === 'ranged' ? 15 : 30));
        this.enemies.push({ x, y, hp, maxHp: hp, type, attackCooldown: 1 + Math.random() });
    }

    draw() {
        const ctx = this.ctx, W = this.width, H = this.height;
        ctx.clearRect(0, 0, W, H);
        const bgGrad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W * 0.7);
        bgGrad.addColorStop(0, '#1a1035');
        bgGrad.addColorStop(1, '#0a0618');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, W, H);
        const cx = this.circleX, cy = this.circleY, r = this.circleRadius;
        ctx.save();
        const breathGlow = 0.5 + (this.breathValue / 100) * 0.5;
        ctx.shadowColor = `rgba(167,139,250,${0.2 * breathGlow})`;
        ctx.shadowBlur = 40 * breathGlow;
        ctx.strokeStyle = `rgba(167,139,250,${0.3 + 0.4 * (this.charge / this.maxCharge)})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.strokeStyle = `rgba(167,139,250,${0.15 + 0.3 * (this.charge / this.maxCharge)})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(cx, cy, r * 0.6, 0, Math.PI * 2);
        ctx.stroke();
        for (let i = 0; i < 8; i++) {
            const a = (i / 8) * Math.PI * 2 + Date.now() / 3000;
            const x = cx + Math.cos(a) * r * 0.85;
            const y = cy + Math.sin(a) * r * 0.85;
            ctx.fillStyle = `rgba(167,139,250,${0.2 + 0.3 * (this.charge / this.maxCharge)})`;
            ctx.font = `${12 + 4 * (this.charge / this.maxCharge)}px serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('✦', x, y);
        }
        ctx.restore();
        ctx.save();
        const chargeAngle = (this.charge / this.maxCharge) * Math.PI * 2 - Math.PI / 2;
        ctx.strokeStyle = '#818cf8';
        ctx.lineWidth = 4;
        ctx.shadowColor = 'rgba(129,140,248,0.5)';
        ctx.shadowBlur = 15;
        ctx.beginPath();
        ctx.arc(cx, cy, r + 16, -Math.PI / 2, chargeAngle);
        ctx.stroke();
        ctx.restore();
        for (const e of this.enemies) {
            ctx.save();
            const color = e.type === 'boss' ? '#ef4444' :
                          e.type === 'fast' ? '#facc15' :
                          e.type === 'ranged' ? '#60a5fa' : '#a78bfa';
            ctx.shadowColor = `${color}44`;
            ctx.shadowBlur = 20;
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(e.x, e.y, e.type === 'boss' ? 24 : 16, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(e.x - 5, e.y - 4, 4, 0, Math.PI * 2);
            ctx.arc(e.x + 5, e.y - 4, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#1a1035';
            ctx.beginPath();
            ctx.arc(e.x - 4, e.y - 3, 2, 0, Math.PI * 2);
            ctx.arc(e.x + 6, e.y - 3, 2, 0, Math.PI * 2);
            ctx.fill();
            const hpW = 30, hpH = 4;
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(e.x - hpW/2, e.y - 28, hpW, hpH);
            ctx.fillStyle = e.hp / e.maxHp > 0.5 ? '#4ade80' : '#f87171';
            ctx.fillRect(e.x - hpW/2, e.y - 28, hpW * (e.hp / e.maxHp), hpH);
            ctx.restore();
        }
        for (const p of this.magicParticles) {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.shadowColor = p.color;
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.font = '13px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(`⚔️ 波次 ${this.wave}/${this.maxWaves}  敵人 ${this.enemies.length}`, 20, 30);
        if (this.hasCrystal) { ctx.fillStyle = '#c084fc'; ctx.fillText('💜 魔力水晶 (+50%)', 20, 52); }
        if (this.hasSpellbook) { ctx.fillStyle = '#facc15'; ctx.fillText('📖 咒語書 (暴擊!)', 20, 74); }
        ctx.textAlign = 'right';
        ctx.fillStyle = '#818cf8';
        ctx.font = '14px monospace';
        ctx.fillText(`${Math.round(this.charge)}%`, W - 20, 30);
    }

    onRestStart() {}
    onRestEnd() {}
}

// ============================================================
//  遊戲四：蒲公英快遞
// ============================================================
class DandelionExpressGame extends GameBase {
    constructor(container, breath) {
        super(container, breath, GAMES.DANDELION_EXPRESS);
        this.playerX = 0; this.playerY = 0;
        this.velocityY = 0;
        this.targetX = 0; this.targetY = 0;
        this.flowers = [];
        this.flowerIndex = 0;
        this.flowersTarget = 5;
        this.obstacles = [];
        this.wind = 0;
        this.windTimer = 0;
        this.timeLimit = 30;
        this.timeLeft = 30;
        this.hasCompass = false;
        this.hasTailwind = false;
        this.tailwindTimer = 0;
        this.particles = [];
        this.flowerParticles = [];
        this.scrollSpeed = 0;
        this.gameOverFlag = false;
        this.levelObstacles = [];
        this._generateLevel();
    }

    _generateLevel() {
        const W = this.width, H = this.height;
        this.playerX = W * 0.1;
        this.playerY = H * 0.5;
        this.velocityY = 0;
        this.flowerIndex = 0;
        this.timeLeft = this.timeLimit;
        this.flowers = [];
        const count = this.flowersTarget;
        for (let i = 0; i < count; i++) {
            this.flowers.push({
                x: W * (0.2 + (i / count) * 0.6) + (Math.random() - 0.5) * 40,
                y: 60 + Math.random() * (H - 120),
                collected: false,
                size: 20 + Math.random() * 10
            });
        }
        this.obstacles = [];
        const obsCount = 3 + this.level * 2;
        for (let i = 0; i < obsCount; i++) {
            this.obstacles.push({
                x: W * (0.15 + Math.random() * 0.7),
                y: 40 + Math.random() * (H - 80),
                w: 20 + Math.random() * 30,
                h: 20 + Math.random() * 30,
                moving: Math.random() > 0.6,
                vx: (Math.random() - 0.5) * 30,
                vy: (Math.random() - 0.5) * 30
            });
        }
        this.gameOverFlag = false;
        this.scrollSpeed = 20 + this.level * 5;
    }

    onBreath(v) {
        if (this.isPlaying && !this.isResting && !this.gameOverFlag) {
            const targetVy = (v / 100) * 120 - 50;
            this.velocityY += (targetVy - this.velocityY) * 0.08;
            this.playerY += this.velocityY * 0.016;
            this.playerY = Math.max(20, Math.min(this.height - 20, this.playerY));
            if (this.hasTailwind) {
                this.playerX += 1.5;
            } else {
                this.playerX += this.scrollSpeed * 0.016;
            }
        }
    }

    update(dt) {
        if (this.gameOverFlag) return;
        this.timeLeft -= dt;
        if (this.timeLeft <= 0) { this.timeLeft = 0; this.gameOver(); return; }
        this.windTimer += dt;
        if (this.windTimer > 3) { this.windTimer = 0; this.wind = (Math.random() - 0.5) * 40; }
        this.playerY += this.wind * dt * 0.1;
        if (this.hasTailwind) {
            this.tailwindTimer -= dt;
            if (this.tailwindTimer <= 0) this.hasTailwind = false;
        }
        if (this.hasCompass) { setTimeout(() => { this.hasCompass = false; }, 5000); }
        for (const flower of this.flowers) {
            if (flower.collected) continue;
            const dx = this.playerX - flower.x, dy = this.playerY - flower.y;
            if (Math.hypot(dx, dy) < 35) {
                flower.collected = true;
                this.flowerIndex++;
                this.addScore(20); this.addCombo(); this.successCount++;
                for (let i = 0; i < 25; i++) {
                    this.flowerParticles.push({
                        x: flower.x, y: flower.y,
                        vx: (Math.random() - 0.5) * 12,
                        vy: (Math.random() - 0.5) * 12 - 4,
                        life: 1,
                        decay: 0.02 + Math.random() * 0.02,
                        size: 2 + Math.random() * 5,
                        color: ['#f472b6','#fb7185','#facc15','#4ade80'][Math.floor(Math.random()*4)]
                    });
                }
                Logger.gameEvent(this.gameId, 'flower_collected', { flowers: this.flowerIndex });
                if (this.flowerIndex >= this.flowersTarget) { this.levelComplete(); return; }
                if (Math.random() < 0.2) { this.hasTailwind = true; this.tailwindTimer = 3; }
                if (Math.random() < 0.1) { this.hasCompass = true; }
            }
        }
        for (const obs of this.obstacles) {
            if (obs.moving) {
                obs.x += obs.vx * dt; obs.y += obs.vy * dt;
                if (obs.x < 20 || obs.x > this.width - 20) obs.vx *= -1;
                if (obs.y < 20 || obs.y > this.height - 20) obs.vy *= -1;
            }
            const halfW = obs.w/2, halfH = obs.h/2;
            const cx = obs.x, cy = obs.y;
            const dist = Math.hypot(this.playerX - cx, this.playerY - cy);
            if (dist < halfW + 15) {
                this.loseLife(); this.resetCombo();
                this.playerX = this.width * 0.1;
                this.playerY = this.height * 0.5;
                this.obstacles = this.obstacles.filter(o => o !== obs);
            }
        }
        for (let i = this.flowerParticles.length - 1; i >= 0; i--) {
            const p = this.flowerParticles[i];
            p.x += p.vx * dt * 60; p.y += p.vy * dt * 60;
            p.vy += 0.2;
            p.life -= p.decay;
            if (p.life <= 0) this.flowerParticles.splice(i, 1);
        }
        if (this.playerX > this.width + 50) { this.gameOver(); }
    }

    draw() {
        const ctx = this.ctx, W = this.width, H = this.height;
        ctx.clearRect(0, 0, W, H);
        const grad = ctx.createLinearGradient(0, 0, 0, H);
        grad.addColorStop(0, '#87CEEB');
        grad.addColorStop(0.6, '#b5dffa');
        grad.addColorStop(0.85, '#7ec87e');
        grad.addColorStop(1, '#4a8f4a');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        for (let i = 0; i < 6; i++) {
            const cx = (i * 150 + Date.now() / 2000) % (W + 100) - 50;
            const cy = 30 + i * 20 % 80;
            ctx.beginPath();
            ctx.arc(cx, cy, 30, 0, Math.PI * 2);
            ctx.arc(cx + 35, cy - 10, 25, 0, Math.PI * 2);
            ctx.arc(cx + 60, cy + 5, 28, 0, Math.PI * 2);
            ctx.fill();
        }
        for (const flower of this.flowers) {
            if (flower.collected) continue;
            ctx.save();
            ctx.strokeStyle = '#4a8f4a';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(flower.x, flower.y + flower.size);
            ctx.lineTo(flower.x, flower.y + flower.size + 25);
            ctx.stroke();
            const petalCount = 6;
            for (let i = 0; i < petalCount; i++) {
                const a = (i / petalCount) * Math.PI * 2 + Date.now() / 2000;
                ctx.fillStyle = ['#f472b6','#fb7185','#facc15','#f87171','#a78bfa','#34d399'][i % 6];
                ctx.beginPath();
                ctx.ellipse(
                    flower.x + Math.cos(a) * flower.size * 0.6,
                    flower.y + Math.sin(a) * flower.size * 0.6,
                    8, 12, a, 0, Math.PI * 2
                );
                ctx.fill();
            }
            ctx.fillStyle = '#facc15';
            ctx.beginPath();
            ctx.arc(flower.x, flower.y, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
        for (const obs of this.obstacles) {
            ctx.save();
            ctx.fillStyle = '#5c3d2e';
            ctx.shadowColor = 'rgba(0,0,0,0.2)';
            ctx.shadowBlur = 10;
            ctx.fillRect(obs.x - obs.w/2, obs.y - obs.h/2, obs.w, obs.h);
            ctx.strokeStyle = '#3d2a1e';
            ctx.lineWidth = 2;
            for (let i = 0; i < 4; i++) {
                const a = (i / 4) * Math.PI * 2;
                ctx.beginPath();
                ctx.moveTo(obs.x, obs.y);
                ctx.lineTo(obs.x + Math.cos(a) * obs.w * 0.6, obs.y + Math.sin(a) * obs.h * 0.6);
                ctx.stroke();
            }
            ctx.restore();
        }
        ctx.save();
        const seedSize = 16 + (this.breathValue / 100) * 8;
        ctx.shadowColor = 'rgba(255,255,255,0.2)';
        ctx.shadowBlur = 20;
        ctx.fillStyle = '#e8e0d0';
        ctx.beginPath();
        ctx.ellipse(this.playerX, this.playerY, 6, 10, 0, 0, Math.PI * 2);
        ctx.fill();
        for (let i = 0; i < 12; i++) {
            const a = (i / 12) * Math.PI * 2 + Date.now() / 4000;
            ctx.strokeStyle = `rgba(255,255,255,${0.3 + 0.3 * (this.breathValue / 100)})`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(this.playerX, this.playerY - 6);
            const len = 12 + (this.breathValue / 100) * 10;
            ctx.lineTo(this.playerX + Math.cos(a) * len, this.playerY - 6 + Math.sin(a) * len);
            ctx.stroke();
        }
        for (let i = 0; i < 8; i++) {
            const t = i / 8;
            const x = this.playerX - t * 30 - (this.breathValue / 100) * 10;
            const y = this.playerY + (Math.random() - 0.5) * 20;
            ctx.fillStyle = `rgba(255,255,255,${0.1 * (1 - t)})`;
            ctx.beginPath();
            ctx.arc(x, y, 2 + t * 2, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
        for (const p of this.flowerParticles) {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.fillRect(16, 16, 180, 40);
        ctx.fillStyle = 'white';
        ctx.font = '13px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(`🌼 ${this.flowerIndex}/${this.flowersTarget}   ⏱️ ${Math.ceil(this.timeLeft)}s`, 24, 44);
        if (this.hasTailwind) { ctx.fillStyle = '#4ade80'; ctx.fillText('💨 順風', 24, 66); }
        if (this.hasCompass) { ctx.fillStyle = '#facc15'; ctx.fillText('🧭 指南針', 24, 88); }
        ctx.save();
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.font = '20px sans-serif';
        ctx.textAlign = 'center';
        const windDir = this.wind > 0 ? '→' : '←';
        ctx.fillText(windDir, W - 30, 30);
        ctx.restore();
    }

    onRestStart() {}
    onRestEnd() {}
    onGameOver() { this.gameOverFlag = true; }
}

// ============================================================
//  遊戲五：玻璃心大師
// ============================================================
class GlassHeartGame extends GameBase {
    constructor(container, breath) {
        super(container, breath, GAMES.GLASS_HEART);
        this.crystalX = 0; this.crystalY = 0;
        this.crystalRadius = 80;
        this.cutPath = [];
        this.cutProgress = 0;
        this.cutIndex = 0;
        this.cutting = false;
        this.cutDepth = 0;
        this.maxDepth = 20;
        this.fractureRisk = 0;
        this.worksDone = 0;
        this.worksTarget = 3;
        this.blueprint = [];
        this.blueprintIndex = 0;
        this.tempPath = [];
        this.hasStrengthen = false;
        this.hasLens = false;
        this.itemTimers = {};
        this.shake = 0;
        this.crystalColor = '#7dd3fc';
        this.particles = [];
        this._generateBlueprint();
    }

    _generateBlueprint() {
        const W = this.width, H = this.height;
        this.crystalX = W/2; this.crystalY = H/2;
        this.crystalRadius = Math.min(W, H) * 0.2;
        this.cutPath = [];
        this.cutIndex = 0;
        this.cutProgress = 0;
        this.fractureRisk = 0;
        this.tempPath = [];
        const complexity = this.level;
        const points = [];
        const cx = this.crystalX, cy = this.crystalY, r = this.crystalRadius * 0.65;
        const steps = 20 + complexity * 10;
        if (complexity === 1) {
            for (let i = 0; i < steps; i++) {
                const t = i / steps;
                points.push({ x: cx - r + t * r * 2, y: cy });
            }
        } else if (complexity === 2) {
            for (let i = 0; i < steps; i++) {
                const t = i / steps;
                points.push({ x: cx - r + t * r * 2, y: cy + 40 * Math.sin(t * Math.PI * 1.5) });
            }
        } else if (complexity === 3) {
            for (let i = 0; i < steps; i++) {
                const t = i / steps;
                const x = cx - r + t * r * 2;
                const y = cy + 30 * Math.sin(t * Math.PI * 2) + 20 * Math.sin(t * Math.PI * 3);
                points.push({ x, y });
            }
        } else if (complexity === 4) {
            for (let i = 0; i < steps; i++) {
                const t = i / steps;
                const angle = -Math.PI/2 + t * Math.PI * 1.8;
                const rad = r * (0.7 + 0.3 * Math.sin(t * Math.PI * 2));
                points.push({ x: cx + rad * Math.cos(angle), y: cy + rad * Math.sin(angle) * 0.6 });
            }
        } else {
            for (let i = 0; i < steps; i++) {
                const t = i / steps;
                const angle = t * Math.PI * 2;
                const rad = r * (0.5 + 0.4 * Math.sin(angle * 5 + 0.5));
                points.push({ x: cx + rad * Math.cos(angle), y: cy + rad * Math.sin(angle) * 0.8 });
            }
        }
        this.blueprint = points;
        this.blueprintIndex = 0;
        this.cutPath = [];
        this.cutProgress = 0;
    }

    onBreath(v) {
        if (this.isPlaying && !this.isResting && this.cutting) {
            const targetDepth = (v / 100) * this.maxDepth;
            this.cutDepth += (targetDepth - this.cutDepth) * 0.1;
            if (v > 70) { this.fractureRisk += (v - 70) / 30 * 0.5; }
            else if (v < 30) { this.fractureRisk += (30 - v) / 30 * 0.3; }
            else { this.fractureRisk *= 0.98; }
            if (this.fractureRisk > 100) { this._fracture(); return; }
            if (this.cutDepth > 3) {
                this.cutProgress += (this.cutDepth / this.maxDepth) * 0.8;
                if (this.cutProgress >= 1) {
                    this.cutProgress = 0;
                    this._completeCut();
                }
            }
        }
    }

    _completeCut() {
        if (this.blueprintIndex >= this.blueprint.length) return;
        const idx = Math.min(this.blueprintIndex, this.blueprint.length - 1);
        this.cutPath.push(this.blueprint[idx]);
        this.blueprintIndex++;
        this.addScore(12);
        this.addCombo();
        this.successCount++;
        for (let i = 0; i < 10; i++) {
            this.particles.push({
                x: this.blueprint[idx].x + (Math.random() - 0.5) * 10,
                y: this.blueprint[idx].y + (Math.random() - 0.5) * 10,
                vx: (Math.random() - 0.5) * 4,
                vy: (Math.random() - 0.5) * 4 - 2,
                life: 1,
                decay: 0.02 + Math.random() * 0.02,
                size: 1 + Math.random() * 3,
                color: '#7dd3fc'
            });
        }
        if (this.blueprintIndex >= this.blueprint.length) {
            this.worksDone++;
            if (this.worksDone >= this.worksTarget) {
                this.levelComplete();
            } else {
                this.cutPath = [];
                this.blueprintIndex = 0;
                this.fractureRisk = 0;
                this.cutDepth = 0;
                this._generateBlueprint();
                Logger.gameEvent(this.gameId, 'work_complete', { works: this.worksDone });
            }
        }
    }

    _fracture() {
        this.loseLife();
        this.resetCombo();
        this.fractureRisk = 0;
        this.cutDepth = 0;
        this.cutProgress = 0;
        for (let i = 0; i < 40; i++) {
            this.particles.push({
                x: this.crystalX + (Math.random() - 0.5) * this.crystalRadius * 1.2,
                y: this.crystalY + (Math.random() - 0.5) * this.crystalRadius * 1.2,
                vx: (Math.random() - 0.5) * 12,
                vy: (Math.random() - 0.5) * 12 - 4,
                life: 1,
                decay: 0.01 + Math.random() * 0.02,
                size: 2 + Math.random() * 6,
                color: '#f87171'
            });
        }
        this.shake = 8;
        this.cutPath = [];
        this.blueprintIndex = 0;
        this._generateBlueprint();
    }

    update(dt) {
        if (this.shake > 0) this.shake *= 0.9;
        if (this.shake < 0.1) this.shake = 0;
        for (let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.x += p.vx * dt * 60; p.y += p.vy * dt * 60;
            p.vy += 0.2;
            p.life -= p.decay;
            if (p.life <= 0) this.particles.splice(i, 1);
        }
        for (const key of Object.keys(this.itemTimers)) {
            this.itemTimers[key] -= dt;
            if (this.itemTimers[key] <= 0) {
                delete this.itemTimers[key];
                if (key === 'strengthen') this.hasStrengthen = false;
                if (key === 'lens') this.hasLens = false;
            }
        }
        if (Math.random() < 0.001) {
            if (Math.random() > 0.5) {
                this.hasStrengthen = true;
                this.itemTimers.strengthen = 5;
            } else {
                this.hasLens = true;
                this.itemTimers.lens = 5;
            }
        }
    }

    draw() {
        const ctx = this.ctx, W = this.width, H = this.height;
        ctx.save();
        const grad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W * 0.7);
        grad.addColorStop(0, '#0f1a2e');
        grad.addColorStop(1, '#060b12');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);
        if (this.shake > 0.5) {
            const sx = (Math.random() - 0.5) * this.shake * 2;
            const sy = (Math.random() - 0.5) * this.shake * 2;
            ctx.translate(sx, sy);
        }
        const cx = this.crystalX, cy = this.crystalY, r = this.crystalRadius;
        ctx.save();
        ctx.shadowColor = 'rgba(125,211,252,0.1)';
        ctx.shadowBlur = 40;
        for (let i = 0; i < 8; i++) {
            const a = (i / 8) * Math.PI * 2 + Date.now() / 5000;
            const x = cx + Math.cos(a) * r * 0.9;
            const y = cy + Math.sin(a) * r * 0.9;
            const grad2 = ctx.createRadialGradient(x, y, 0, cx, cy, r);
            grad2.addColorStop(0, 'rgba(125,211,252,0.05)');
            grad2.addColorStop(0.5, 'rgba(125,211,252,0.08)');
            grad2.addColorStop(1, 'rgba(125,211,252,0.02)');
            ctx.fillStyle = grad2;
            ctx.beginPath();
            ctx.arc(cx, cy, r * (0.7 + 0.3 * Math.sin(a + 1.2)), 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.strokeStyle = 'rgba(125,211,252,0.2)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
        ctx.save();
        ctx.setLineDash([6, 8]);
        ctx.strokeStyle = 'rgba(125,211,252,0.25)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        if (this.blueprint.length > 0) {
            const startIdx = Math.max(0, this.blueprintIndex - 1);
            ctx.moveTo(this.blueprint[startIdx].x, this.blueprint[startIdx].y);
            for (let i = startIdx + 1; i < this.blueprint.length; i++) {
                ctx.lineTo(this.blueprint[i].x, this.blueprint[i].y);
            }
        }
        ctx.stroke();
        ctx.setLineDash([]);
        if (this.blueprintIndex < this.blueprint.length) {
            const p = this.blueprint[this.blueprintIndex];
            ctx.shadowColor = 'rgba(250,204,21,0.6)';
            ctx.shadowBlur = 25;
            ctx.fillStyle = '#facc15';
            ctx.beginPath();
            ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }
        ctx.restore();
        if (this.cutPath.length > 1) {
            ctx.save();
            ctx.shadowColor = 'rgba(125,211,252,0.3)';
            ctx.shadowBlur = 15;
            ctx.strokeStyle = '#7dd3fc';
            ctx.lineWidth = 2 + (this.cutDepth / this.maxDepth) * 4;
            ctx.beginPath();
            ctx.moveTo(this.cutPath[0].x, this.cutPath[0].y);
            for (let i = 1; i < this.cutPath.length; i++) {
                ctx.lineTo(this.cutPath[i].x, this.cutPath[i].y);
            }
            ctx.stroke();
            ctx.restore();
        }
        if (this.cutDepth > 1 && this.blueprintIndex < this.blueprint.length) {
            const p = this.blueprint[this.blueprintIndex];
            ctx.save();
            const depth = Math.min(this.cutDepth / this.maxDepth, 1);
            ctx.fillStyle = `rgba(125,211,252,${0.1 + depth * 0.3})`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 6 + depth * 10, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
        if (this.fractureRisk > 20) {
            const risk = Math.min(this.fractureRisk / 100, 1);
            ctx.save();
            const color = `rgba(239,68,68,${risk * 0.3})`;
            ctx.shadowColor = color;
            ctx.shadowBlur = 30 * risk;
            ctx.strokeStyle = color;
            ctx.lineWidth = 2 + risk * 4;
            ctx.beginPath();
            ctx.arc(cx, cy, r + 10 + risk * 15, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        }
        for (const p of this.particles) {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.shadowColor = p.color;
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.font = '13px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(`💎 作品 ${this.worksDone}/${this.worksTarget}  進度 ${Math.round(this.cutProgress * 100)}%`, 20, 30);
        ctx.fillText(`⚡ 風險 ${Math.round(this.fractureRisk)}%`, 20, 52);
        if (this.hasStrengthen) { ctx.fillStyle = '#4ade80'; ctx.fillText('💪 強化液 (容錯+1)', 20, 74); }
        if (this.hasLens) { ctx.fillStyle = '#60a5fa'; ctx.fillText('🔮 透鏡', 20, 96); }
        ctx.restore();
    }

    onRestStart() { this.cutting = false; }
    onRestEnd() { this.cutting = true; }
    toggleCutting() { this.cutting = !this.cutting; return this.cutting; }
}

// ============================================================
//  主應用程式 (App)
// ============================================================
class App {
    constructor() {
        this.root = document.getElementById('root');
        this.breath = new BreathController();
        this.currentGame = null;
        this.gameInstance = null;
        this.container = null;
        this.currentView = 'menu';
